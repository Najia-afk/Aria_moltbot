name: aria-nas-backup

# Dedicated, isolated SFTP-only backup target on the NAS's HDD (Volume1).
#
# Separation of duty: this is a completely separate Docker project from
# aria-nas-ollama, with its own dedicated SSH key that lives ONLY in the Mac
# Mini's ~/.ssh (outside every Aria container/network). Aria's own containers
# (aria-api, aria-brain, aria-engine, etc.) have no credentials and no network
# path to this service — only the Mac's launchd backup job can reach it.
#
# Auth is key-only (empty password field in `command` below disables password
# login). The user is chrooted to their home directory by OpenSSH itself.
#
# No file upload/transfer to the NAS is needed to deploy this — paste this
# file as-is into the NAS's "Create Project from Compose" UI. The public key
# below is not secret; it's safe to commit to git (only the matching private
# key on the Mac, in ~/.ssh, ever authenticates).

services:
  # One-shot: creates /volume1/aria-archive (with correct ownership for the
  # sftp user below) if it doesn't already exist. Avoids needing to create
  # this folder manually via the NAS Files app.
  storage-init:
    image: alpine:3.20
    container_name: aria-nas-backup-storage-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /mnt/volume1/aria-archive
        chown -R 2001:2001 /mnt/volume1/aria-archive
    volumes:
      - /volume1:/mnt/volume1
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges=true

  # One-shot: writes the Mac's *public* key into a named volume that the sftp
  # service mounts read-only. Avoids needing to transfer any file to the NAS
  # outside of this compose text itself.
  key-init:
    image: alpine:3.20
    container_name: aria-nas-backup-key-init
    restart: "no"
    environment:
      AUTHORIZED_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICf0P5Ye71YDyp0Jig3TiObZnqSfbYuH1hUpUHutTd5v aria-backup-mac-mini"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "$$AUTHORIZED_KEY" > /keys/aria-backup.pub
        chmod 644 /keys/aria-backup.pub
    volumes:
      - sftp-keys:/keys
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true

  sftp:
    image: atmoz/sftp@sha256:81fa92512bf8ead4849f33c1c153907b86d32d77704d1c62a9c70b4316ae9e50
    container_name: aria-nas-backup
    restart: unless-stopped
    depends_on:
      key-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    command: aria-backup::2001:2001:archive
    ports:
      - name: sftp-backup-lan
        target: 22
        published: "2222"
        protocol: tcp
    volumes:
      - sftp-keys:/home/aria-backup/.ssh/keys:ro
      # Actual backup archive storage, on the HDD (Volume1).
      - /volume1/aria-archive:/home/aria-backup/archive
      # Persist generated SSH host keys across recreates (stable fingerprint).
      - sftp-host-keys:/etc/ssh
    cap_drop:
      - ALL
    cap_add:
      # Required by the sftp entrypoint to create the user and chown its home.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges=true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pidof", "sshd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sftp-keys:
    name: aria-nas-backup-keys
  sftp-host-keys:
    name: aria-nas-backup-host-keys
