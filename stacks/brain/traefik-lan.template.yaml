tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem

http:
  routers:
    redirect-to-https:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: portal
      middlewares: [redirect-https]

    ws:
      rule: "PathPrefix(`/ws`)"
      priority: 100
      entryPoints: [websecure]
      service: aria-api
      middlewares: [lan-auth, secure-headers]
      tls: {}

    api:
      rule: "PathPrefix(`/api/`) || Path(`/api`)"
      priority: 100
      entryPoints: [websecure]
      service: aria-api
      middlewares: [lan-auth, api-auth-inject, api-strip, secure-headers]
      tls: {}

    portal:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [websecure]
      service: portal
      middlewares: [lan-auth, secure-headers]
      tls: {}

  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        port: "${TRAEFIK_HTTPS_PORT}"
        permanent: true

    lan-auth:
      basicAuth:
        users:
          - "${ARIA_LAN_USER}:${ARIA_LAN_PASSWORD_HASH}"
        removeHeader: true

    api-auth-inject:
      headers:
        customRequestHeaders:
          X-API-Key: "${ARIA_API_KEY}"

    api-strip:
      stripPrefix:
        prefixes: [/api]

    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders: [Content-Type, X-API-Key]
        accessControlAllowOriginList:
          - "https://${SERVICE_HOST}:${TRAEFIK_HTTPS_PORT}"
        accessControlMaxAge: 100
        addVaryHeader: true

  services:
    portal:
      loadBalancer:
        servers:
          - url: "http://aria-web:5000"
    aria-api:
      loadBalancer:
        servers:
          - url: "http://aria-api:8000"